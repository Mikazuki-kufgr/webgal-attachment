<!DOCTYPE html>
<html lang="zh-Hans">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <title>WebGAL 附件制作器 / 独立验证预览</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #161b22;
      }
      html {
        position: absolute;
        width: 100vw;
        height: 100vh;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        transform-origin: center;
      }
      #root {
        width: 100%;
        height: 100%;
      }
      .html-body__effect-background,
      .html-body__effect-background-overlay {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        background-position: center;
        background-repeat: no-repeat;
        background-size: cover;
        pointer-events: none;
      }
      .html-body__effect-background {
        filter: blur(50px);
      }
      .html-body__effect-background-overlay {
        background: black;
        opacity: 0;
      }
    </style>
  </head>
  <body>
    <div id="ebg" class="html-body__effect-background">
      <div id="ebgOverlay" class="html-body__effect-background-overlay"></div>
    </div>
    <div id="html-body__panic-overlay"></div>
    <div id="root"></div>
    <script>
      (() => {
        const userAgent = navigator.userAgent || '';
        const platform = navigator.userAgentData?.platform || navigator.platform || '';
        const isIOSPhone = /iPhone|iPod/i.test(userAgent);
        const isIPad = /iPad/i.test(userAgent) || (/Mac/i.test(platform) && (navigator.maxTouchPoints || 0) > 1);
        window.__WEBGAL_DEVICE_INFO__ = { isIOS: isIOSPhone || isIPad, isIOSPhone, isIPad };
        window.renderPromise = new Promise((resolve) => {
          window.renderPromiseResolve = () => {
            resolve();
            delete window.renderPromiseResolve;
          };
        });
        // SDK files are separately supplied authorized local resources. This
        // entry does not confer or claim public redistribution permission.
        const loadSdk = (source) =>
          new Promise((resolve) => {
            const script = document.createElement('script');
            let settled = false;
            const finish = (ok) => {
              if (settled) return;
              settled = true;
              clearTimeout(timer);
              script.onload = script.onerror = null;
              if (!ok) {
                script.remove();
                console.error('CREATOR_SDK_LOAD_FAILED', source);
              }
              resolve(ok);
            };
            const timer = setTimeout(() => finish(false), 15000);
            script.src = source;
            script.onload = () => finish(true);
            script.onerror = () => finish(false);
            document.head.appendChild(script);
          });
        window.live2dPromise = Promise.all([loadSdk('lib/live2d.min.js'), loadSdk('lib/live2dcubismcore.min.js')]);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
